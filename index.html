<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Platformer</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #101522;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
    }

    #gameContainer {
        width: 100%;
        max-width: 1000px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    canvas {
        display: block;
        background: linear-gradient(#5db7ff, #d9f3ff);
        border: 3px solid #ffffff;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        width: min(95vw, 1000px, calc(166.6667dvh - 200px));
        height: auto;
        max-width: 95vw;
    }

    #infoRow {
        position: relative;
        width: min(100%, 1000px);
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 8px;
        padding: 0;
    }

    #info {
        margin: 0;
        font-size: 16px;
        line-height: 20px;
        color: #ddd;
        text-align: center;
    }

    #mobileControls {
        display: none;
        width: min(100%, 640px);
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 8px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    .controlGroup {
        display: flex;
        align-items: center;
        gap: clamp(10px, 1.5vw, 18px);
    }

    .controlButton {
        display: flex;
        align-items: center;
        justify-content: center;
        width: clamp(64px, 8vw, 88px);
        height: clamp(58px, 7vw, 76px);
        min-width: 56px;
        min-height: 54px;
        padding: 0;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 13px;
        background: #26334b;
        color: #fff;
        box-shadow: 0 4px 0 #111827;
        font-family: Arial, sans-serif;
        font-size: clamp(25px, 3vw, 34px);
        font-weight: bold;
        line-height: 1;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    .controlButton.pressed {
        background: #405779;
        transform: translateY(2px);
        box-shadow: 0 2px 0 #111827;
    }

    #jumpButton {
        width: clamp(92px, 12vw, 128px);
        font-size: clamp(15px, 2vw, 19px);
        letter-spacing: 0.3px;
    }

    #message {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.75);
        padding: 12px 22px;
        border-radius: 8px;
        font-size: 20px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: calc(100vw - 24px);
        text-align: center;
        z-index: 20;
    }

    /* Touchscreen devices, including iPads */
    @media (hover: none) and (pointer: coarse), (max-width: 600px) {
        body {
            padding: max(8px, env(safe-area-inset-top))
                     max(8px, env(safe-area-inset-right))
                     max(8px, env(safe-area-inset-bottom))
                     max(8px, env(safe-area-inset-left));
        }

        #mobileControls {
            display: flex;
            flex-shrink: 0;
        }

        #infoRow {
            margin-top: 6px;
            padding: 0 4px;
            min-height: 38px;
        }

        #info {
            font-size: 14px;
            line-height: 18px;
            text-align: left;
        }

        #message {
            font-size: 16px;
            padding: 10px 16px;
        }
    }

    /* Landscape phones */
    @media (orientation: landscape) and (max-height: 500px) {
        body {
            padding: 4px 10px;
            padding-bottom: max(4px, env(safe-area-inset-bottom));
            min-height: 100vh;
            min-height: 100dvh;
        }

        #gameContainer {
            width: 100%;
            gap: 0;
        }

        canvas {
            width: min(95vw, 1000px, calc(166.6667dvh - 200px));
            max-width: 100%;
            height: auto;
        }

        #infoRow {
            margin-top: 2px;
            min-height: 32px;
            padding-left: 4px;
            padding-right: 4px;
        }

        #info {
            font-size: 11px;
            line-height: 14px;
        }

        #mobileControls {
            width: min(100%, 640px);
            gap: 12px;
            margin-top: 4px;
            padding: 0 4px;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .controlGroup {
            gap: 10px;
        }

        .controlButton {
            width: clamp(64px, 8vw, 84px);
            height: clamp(56px, 7vw, 70px);
            min-width: 56px;
            min-height: 52px;
            border-radius: 11px;
            font-size: clamp(25px, 3vw, 32px);
        }

        #jumpButton {
            width: clamp(92px, 12vw, 120px);
            height: clamp(56px, 7vw, 70px);
            font-size: clamp(15px, 2vw, 18px);
        }
    }
</style>
</head>

<body>

<div id="gameContainer">
    <canvas id="game" width="1000" height="600"></canvas>

    <div id="mobileControls" aria-label="Mobile game controls">
        <div class="controlGroup">
            <button type="button" id="leftButton" class="controlButton" aria-label="Move left">◀</button>
            <button type="button" id="rightButton" class="controlButton" aria-label="Move right">▶</button>
        </div>
        <button type="button" id="jumpButton" class="controlButton" aria-label="Jump">JUMP</button>
    </div>
</div>

<div id="message"></div>

<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const GRAVITY = 0.55;
const MOVE_SPEED = 5;
const JUMP_POWER = 12;

const PLAYER_WIDTH = 30;
const PLAYER_HEIGHT = 42;

const PLATFORM_HEIGHT = 18;

const PLATFORM_COUNT = 22;

const MAX_PLATFORM_GAP = 135;

const MIN_PLATFORM_WIDTH = 100;
const MAX_PLATFORM_WIDTH = 180;

const SLUG_WIDTH = 25;
const SLUG_HEIGHT = 8;

const SLUG_SPEED = 1.2;

const keys = {
    left: false,
    right: false,
    jump: false
};

let jumpPressed = false;

// Mobile buttons use the same input flags as the keyboard.
function bindTouchButton(buttonId, keyName, isJumpButton = false) {
    const button = document.getElementById(buttonId);

    function releaseButton() {
        if (isJumpButton) {
            keys.jump = false;
        } else {
            keys[keyName] = false;
        }

        button.classList.remove("pressed");
    }

    button.addEventListener("pointerdown", function(e) {
        e.preventDefault();

        if (button.setPointerCapture) {
            button.setPointerCapture(e.pointerId);
        }

        if (isJumpButton) {
            if (!keys.jump) {
                jumpPressed = true;
            }

            keys.jump = true;
        } else {
            keys[keyName] = true;
        }

        button.classList.add("pressed");
    });

    button.addEventListener("pointerup", function(e) {
        e.preventDefault();
        releaseButton();
    });

    button.addEventListener("pointercancel", releaseButton);
    button.addEventListener("lostpointercapture", releaseButton);
}

bindTouchButton("leftButton", "left");
bindTouchButton("rightButton", "right");
bindTouchButton("jumpButton", "jump", true);

function releaseAllControls() {
    keys.left = false;
    keys.right = false;
    keys.jump = false;

    document.querySelectorAll(".controlButton").forEach(function(button) {
        button.classList.remove("pressed");
    });
}

window.addEventListener("blur", releaseAllControls);

document.addEventListener("visibilitychange", function() {
    if (document.hidden) {
        releaseAllControls();
    }
});

document.addEventListener("keydown", function(e) {
    if (
        e.code === "ArrowLeft" ||
        e.code === "ArrowRight" ||
        e.code === "Space"
    ) {
        e.preventDefault();
    }

    if (e.code === "ArrowLeft") {
        keys.left = true;
    }

    if (e.code === "ArrowRight") {
        keys.right = true;
    }

    if (e.code === "Space") {
        if (!keys.jump) {
            jumpPressed = true;
        }

        keys.jump = true;
    }
});

document.addEventListener("keyup", function(e) {
    if (e.code === "ArrowLeft") {
        keys.left = false;
    }

    if (e.code === "ArrowRight") {
        keys.right = false;
    }

    if (e.code === "Space") {
        keys.jump = false;
    }
});

const player = {
    x: 0,
    y: 0,
    width: PLAYER_WIDTH,
    height: PLAYER_HEIGHT,
    vx: 0,
    vy: 0,
    grounded: false
};

let platforms = [];
let slugs = [];

let goal = {
    x: 0,
    y: 0,
    width: 35,
    height: 50
};

const camera = {
    x: 0,
    y: 0
};

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function randomInt(min, max) {
    return Math.floor(random(min, max + 1));
}

function generateLevel() {
    platforms = [];
    slugs = [];

    const startPlatform = {
        x: 40,
        y: HEIGHT - 80,
        width: 180,
        height: PLATFORM_HEIGHT,
        guaranteed: true
    };

    platforms.push(startPlatform);

    let currentX = startPlatform.x;
    let currentY = startPlatform.y;

    const route = [];
    const routeCount = 16;

    for (let i = 0; i < routeCount; i++) {
        const horizontalMove = randomInt(80, MAX_PLATFORM_GAP);
        currentX += horizontalMove;

        const verticalMove = randomInt(-80, 65);
        currentY += verticalMove;

        currentY = Math.max(
            100,
            Math.min(HEIGHT - 80, currentY)
        );

        const width = randomInt(
            MIN_PLATFORM_WIDTH,
            MAX_PLATFORM_WIDTH
        );

        const platform = {
            x: currentX,
            y: currentY,
            width: width,
            height: PLATFORM_HEIGHT,
            guaranteed: true
        };

        platforms.push(platform);
        route.push(platform);
    }

    const lastPlatform = route[route.length - 1];

    goal.x =
        lastPlatform.x +
        lastPlatform.width -
        50;

    goal.y =
        lastPlatform.y -
        goal.height;

    for (let i = 0; i < PLATFORM_COUNT; i++) {
        const x = random(0, currentX + 200);
        const y = random(80, HEIGHT - 50);
        const width = randomInt(70, 150);

        const platform = {
            x: x,
            y: y,
            width: width,
            height: PLATFORM_HEIGHT,
            guaranteed: false
        };

        let overlapsRoute = false;

        for (const p of platforms) {
            if (
                x < p.x + p.width &&
                x + width > p.x &&
                Math.abs(y - p.y) < 35
            ) {
                overlapsRoute = true;
                break;
            }
        }

        if (!overlapsRoute) {
            platforms.push(platform);
        }
    }

    createSlugs();

    player.x =
        startPlatform.x +
        startPlatform.width / 2 -
        player.width / 2;

    player.y =
        startPlatform.y -
        player.height;

    player.vx = 0;
    player.vy = 0;
    player.grounded = true;

    camera.x = 0;
    camera.y = 0;
}

function createSlugs() {
    slugs = [];

    for (let i = 0; i < platforms.length; i++) {
        const platform = platforms[i];

        if (i === 0) {
            continue;
        }

        if (Math.random() > 0.45) {
            continue;
        }

        if (
            Math.abs(platform.x - goal.x) < 50 &&
            Math.abs(platform.y - goal.y) < 50
        ) {
            continue;
        }

        const slug = {
            platform: platform,
            width: SLUG_WIDTH,
            height: SLUG_HEIGHT,
            x: random(
                platform.x + 10,
                platform.x + platform.width - SLUG_WIDTH - 10
            ),
            y: platform.y - SLUG_HEIGHT,
            vx: Math.random() < 0.5 ? -SLUG_SPEED : SLUG_SPEED
        };

        slugs.push(slug);
    }
}

function updateSlugs() {
    for (const slug of slugs) {
        slug.x += slug.vx;

        const platform = slug.platform;
        const leftEdge = platform.x;
        const rightEdge = platform.x + platform.width - slug.width;

        if (slug.x <= leftEdge) {
            slug.x = leftEdge;
            slug.vx = Math.abs(slug.vx);
        }

        if (slug.x >= rightEdge) {
            slug.x = rightEdge;
            slug.vx = -Math.abs(slug.vx);
        }

        if (Math.random() < 0.004) {
            slug.vx *= -1;
        }
    }
}

function isColliding(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function updatePlayer() {
    if (keys.left) {
        player.vx = -MOVE_SPEED;
    } else if (keys.right) {
        player.vx = MOVE_SPEED;
    } else {
        player.vx *= 0.8;

        if (Math.abs(player.vx) < 0.05) {
            player.vx = 0;
        }
    }

    if (jumpPressed && player.grounded) {
        player.vy = -JUMP_POWER;
        player.grounded = false;
    }

    jumpPressed = false;

    player.vy += GRAVITY;
    player.x += player.vx;

    const oldY = player.y;

    player.y += player.vy;
    player.grounded = false;

    for (const platform of platforms) {
        if (player.vy >= 0) {
            const playerBottom = player.y + player.height;
            const oldBottom = oldY + player.height;
            const platformTop = platform.y;

            if (
                oldBottom <= platformTop &&
                playerBottom >= platformTop &&
                player.x + player.width > platform.x &&
                player.x < platform.x + platform.width
            ) {
                player.y = platformTop - player.height;
                player.vy = 0;
                player.grounded = true;
            }
        }
    }

    if (player.x < 0) {
        player.x = 0;
        player.vx = 0;
    }

    if (player.y > HEIGHT + 200) {
        resetPlayer();
    }
}

function checkSlugCollisions() {
    for (const slug of slugs) {
        if (isColliding(player, slug)) {
            resetPlayer();
            showMessage("Ouch! Try again!");
            return;
        }
    }
}

function resetPlayer() {
    const start = platforms[0];

    player.x =
        start.x +
        start.width / 2 -
        player.width / 2;

    player.y =
        start.y -
        player.height;

    player.vx = 0;
    player.vy = 0;
    player.grounded = true;

    camera.x = 0;
}

function checkGoal() {
    const goalHitbox = {
        x: goal.x,
        y: goal.y,
        width: goal.width,
        height: goal.height
    };

    if (isColliding(player, goalHitbox)) {
        showMessage("Level complete! New level!");

        setTimeout(function() {
            generateLevel();
        }, 600);
    }
}

function updateCamera() {
    const targetX = player.x - WIDTH * 0.35;

    camera.x += (targetX - camera.x) * 0.1;

    if (camera.x < 0) {
        camera.x = 0;
    }

    const furthestPlatform = platforms.reduce(
        (furthest, p) => Math.max(furthest, p.x + p.width),
        WIDTH
    );

    const maxCamera = Math.max(0, furthestPlatform - WIDTH);

    if (camera.x > maxCamera) {
        camera.x = maxCamera;
    }
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);

    gradient.addColorStop(0, "#4ca7ff");
    gradient.addColorStop(1, "#d8f5ff");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.fillStyle = "rgba(255,255,255,0.65)";

    for (let i = 0; i < 8; i++) {
        const x =
            ((i * 230) - camera.x * 0.2) %
            (WIDTH + 250);

        const y = 70 + (i % 3) * 70;

        drawCloud(x, y);
    }

    ctx.fillStyle = "rgba(70,150,100,0.35)";
    ctx.beginPath();
    ctx.moveTo(0, HEIGHT);

    for (let x = 0; x <= WIDTH; x += 40) {
        const y =
            HEIGHT -
            100 -
            Math.sin((x + camera.x * 0.25) * 0.01) * 40;

        ctx.lineTo(x, y);
    }

    ctx.lineTo(WIDTH, HEIGHT);
    ctx.closePath();
    ctx.fill();
}

function drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.arc(x + 25, y - 10, 28, 0, Math.PI * 2);
    ctx.arc(x + 55, y, 22, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlatforms() {
    for (const platform of platforms) {
        const x = platform.x - camera.x;
        const y = platform.y;

        if (
            x + platform.width < 0 ||
            x > WIDTH
        ) {
            continue;
        }

        ctx.fillStyle = "#55c34a";
        ctx.fillRect(x, y, platform.width, 6);

        ctx.fillStyle = "#80512f";
        ctx.fillRect(
            x,
            y + 6,
            platform.width,
            platform.height - 6
        );

        ctx.fillStyle = "#633d25";

        for (
            let dotX = x + 12;
            dotX < x + platform.width - 5;
            dotX += 25
        ) {
            ctx.fillRect(dotX, y + 11, 5, 3);
        }
    }
}

function drawSlugs() {
    for (const slug of slugs) {
        const x = slug.x - camera.x;
        const y = slug.y;

        if (
            x + slug.width < 0 ||
            x > WIDTH
        ) {
            continue;
        }

        ctx.fillStyle = "#d71920";
        ctx.beginPath();
        ctx.ellipse(
            x + slug.width / 2,
            y + slug.height / 2,
            slug.width / 2,
            slug.height / 2,
            0,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "#ff4545";
        ctx.beginPath();
        ctx.ellipse(x + 8, y + 3, 5, 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + 17, y + 1, 3, 3);
        ctx.fillRect(x + 22, y + 1, 3, 3);

        ctx.fillStyle = "#111";
        ctx.fillRect(x + 18, y + 2, 2, 2);
        ctx.fillRect(x + 23, y + 2, 2, 2);
    }
}

function drawGoal() {
    const x = goal.x - camera.x;
    const y = goal.y;

    ctx.fillStyle = "#555";
    ctx.fillRect(x + 14, y, 5, goal.height);

    ctx.fillStyle = "#ff3d67";
    ctx.beginPath();
    ctx.moveTo(x + 19, y + 3);
    ctx.lineTo(x + 35, y + 12);
    ctx.lineTo(x + 19, y + 21);
    ctx.closePath();
    ctx.fill();
}

function drawPlayer() {
    const x = player.x - camera.x;
    const y = player.y;

    ctx.fillStyle = "#e53935";
    ctx.fillRect(x, y, player.width, player.height);

    ctx.fillStyle = "#1976d2";
    ctx.fillRect(x, y + 18, player.width, player.height - 18);

    ctx.fillStyle = "#ffd1a9";
    ctx.fillRect(x + 5, y + 4, 20, 17);

    ctx.fillStyle = "#38251a";
    ctx.fillRect(x + 4, y + 2, 22, 6);

    ctx.fillStyle = "#111";
    ctx.fillRect(x + 9, y + 10, 3, 3);
    ctx.fillRect(x + 19, y + 10, 3, 3);

    ctx.fillStyle = "#263238";
    ctx.fillRect(x + 3, y + 34, 9, 8);
    ctx.fillRect(x + 18, y + 34, 9, 8);
}

function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(15, 15, 300, 50);

    ctx.fillStyle = "#fff";
    ctx.font = "16px Arial";
    ctx.fillText("← → Move   SPACE Jump", 30, 36);

    ctx.font = "13px Arial";
    ctx.fillStyle = "#ddd";
    ctx.fillText("Reach the red flag — avoid slugs!", 30, 55);
}

const message = document.getElementById("message");
let messageTimeout = null;

function showMessage(text) {
    message.textContent = text;
    message.style.opacity = "1";

    clearTimeout(messageTimeout);

    messageTimeout = setTimeout(function() {
        message.style.opacity = "0";
    }, 900);
}

function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    drawBackground();
    drawPlatforms();
    drawSlugs();
    drawGoal();
    drawPlayer();
    drawHUD();
}

function gameLoop() {
    updatePlayer();
    updateSlugs();
    checkSlugCollisions();
    updateCamera();
    checkGoal();
    draw();

    requestAnimationFrame(gameLoop);
}

generateLevel();
gameLoop();

</script>
</body>
</html>
