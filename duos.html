<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Platformer</title>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #101522;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
    }

    #gameContainer {
        width: 100%;
        max-width: 1000px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    canvas {
        display: block;
        background: linear-gradient(#5db7ff, #d9f3ff);
        border: 3px solid #ffffff;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        width: min(95vw, 1000px, calc(166.6667dvh - 200px));
        height: auto;
        max-width: 95vw;
    }

    #infoRow {
        position: relative;
        width: min(100%, 1000px);
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 8px;
        padding: 0;
    }

    #info {
        margin: 0;
        font-size: 16px;
        line-height: 20px;
        color: #ddd;
        text-align: center;
    }

    #mobileControls {
        display: none;
        width: min(100%, 640px);
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 8px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    .controlGroup {
        display: flex;
        align-items: center;
        gap: clamp(10px, 1.5vw, 18px);
    }

    .controlButton {
        display: flex;
        align-items: center;
        justify-content: center;
        width: clamp(64px, 8vw, 88px);
        height: clamp(58px, 7vw, 76px);
        min-width: 56px;
        min-height: 54px;
        padding: 0;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 13px;
        background: #26334b;
        color: #fff;
        box-shadow: 0 4px 0 #111827;
        font-family: Arial, sans-serif;
        font-size: clamp(25px, 3vw, 34px);
        font-weight: bold;
        line-height: 1;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    .controlButton.pressed {
        background: #405779;
        transform: translateY(2px);
        box-shadow: 0 2px 0 #111827;
    }

    #jumpButton {
        width: clamp(92px, 12vw, 128px);
        font-size: clamp(15px, 2vw, 19px);
        letter-spacing: 0.3px;
    }

    #message {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.75);
        padding: 12px 22px;
        border-radius: 8px;
        font-size: 20px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: calc(100vw - 24px);
        text-align: center;
        z-index: 20;
    }

    /* Touchscreen devices, including iPads */
    @media (hover: none) and (pointer: coarse), (max-width: 600px) {
        body {
            padding: max(8px, env(safe-area-inset-top))
                     max(8px, env(safe-area-inset-right))
                     max(8px, env(safe-area-inset-bottom))
                     max(8px, env(safe-area-inset-left));
        }

        #mobileControls {
            display: flex;
            flex-shrink: 0;
        }

        #infoRow {
            margin-top: 6px;
            padding: 0 4px;
            min-height: 38px;
        }

        #info {
            font-size: 14px;
            line-height: 18px;
            text-align: left;
        }

        #message {
            font-size: 16px;
            padding: 10px 16px;
        }
    }

    /* Landscape phones */
    @media (orientation: landscape) and (max-height: 500px) {
        body {
            padding: 4px 10px;
            padding-bottom: max(4px, env(safe-area-inset-bottom));
            min-height: 100vh;
            min-height: 100dvh;
        }

        #gameContainer {
            width: 100%;
            gap: 0;
        }

        canvas {
            width: min(95vw, 1000px, calc(166.6667dvh - 200px));
            max-width: 100%;
            height: auto;
        }

        #infoRow {
            margin-top: 2px;
            min-height: 32px;
            padding-left: 4px;
            padding-right: 4px;
        }

        #info {
            font-size: 11px;
            line-height: 14px;
        }

        #mobileControls {
            width: min(100%, 640px);
            gap: 12px;
            margin-top: 4px;
            padding: 0 4px;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .controlGroup {
            gap: 10px;
        }

        .controlButton {
            width: clamp(64px, 8vw, 84px);
            height: clamp(56px, 7vw, 70px);
            min-width: 56px;
            min-height: 52px;
            border-radius: 11px;
            font-size: clamp(25px, 3vw, 32px);
        }

        #jumpButton {
            width: clamp(92px, 12vw, 120px);
            height: clamp(56px, 7vw, 70px);
            font-size: clamp(15px, 2vw, 18px);
        }
    }

    /* Multiplayer lobby; hidden after a successful host/join. */
    #lobbyPanel {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        width: min(560px, calc(100vw - 24px));
        padding: 14px;
        border: 1px solid rgba(255,255,255,0.25);
        border-radius: 12px;
        background: rgba(16, 21, 34, 0.96);
        box-shadow: 0 12px 35px rgba(0,0,0,0.45);
        z-index: 30;
        text-align: left;
    }

    #lobbyPanel.hidden {
        display: none;
    }

    #lobbyTitle {
        margin: 0 0 10px;
        font-size: 18px;
        font-weight: bold;
        text-align: center;
    }

    .lobbyRow {
        display: flex;
        gap: 8px;
        margin-top: 8px;
    }

    .lobbyRow input {
        flex: 1 1 auto;
        min-width: 0;
        height: 42px;
        padding: 0 10px;
        border: 1px solid #66738a;
        border-radius: 7px;
        background: #0c1220;
        color: #fff;
        font: 16px Arial, sans-serif;
    }

    .lobbyRow input::placeholder {
        color: #aab3c4;
    }

    .lobbyRow button {
        flex: 0 0 auto;
        min-height: 42px;
        padding: 0 13px;
        border: 0;
        border-radius: 7px;
        background: #3478d4;
        color: #fff;
        font: bold 14px Arial, sans-serif;
        cursor: pointer;
    }

    .lobbyRow button:disabled {
        opacity: 0.6;
        cursor: wait;
    }

    #lobbyStatus {
        margin: 10px 2px 0;
        color: #cbd4e3;
        font-size: 12px;
        line-height: 1.4;
        text-align: center;
    }

    #lobbyStatus.error {
        color: #ff9c9c;
    }

    @media (max-width: 420px) {
        #lobbyPanel {
            padding: 10px;
        }

        .lobbyRow button {
            padding: 0 9px;
            font-size: 12px;
        }
    }

</style>
</head>

<body>

<div id="lobbyPanel" aria-label="Multiplayer lobby">
    <div id="lobbyTitle">Multiplayer</div>
    <div class="lobbyRow">
        <input id="hostPeerIdInput" type="text" maxlength="64" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Choose your lobby peer ID" aria-label="Choose your lobby peer ID">
        <button type="button" id="createLobbyButton">Create lobby</button>
    </div>
    <div class="lobbyRow">
        <input id="joinPeerIdInput" type="text" maxlength="64" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Enter host peer ID" aria-label="Enter host peer ID">
        <button type="button" id="joinLobbyButton">Join lobby</button>
    </div>
    <div id="lobbyStatus" role="status">Host: choose a unique ID and create a lobby. Friends enter that same ID to join.</div>
</div>

<div id="gameContainer">
    <canvas id="game" width="1000" height="600"></canvas>

    <div id="mobileControls" aria-label="Mobile game controls">
        <div class="controlGroup">
            <button type="button" id="leftButton" class="controlButton" aria-label="Move left">◀</button>
            <button type="button" id="rightButton" class="controlButton" aria-label="Move right">▶</button>
        </div>
        <button type="button" id="jumpButton" class="controlButton" aria-label="Jump">JUMP</button>
    </div>
</div>

<div id="message"></div>

<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>
<script>
"use strict";

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const GRAVITY = 0.55;
const MOVE_SPEED = 5;
const JUMP_POWER = 12;

const PLAYER_WIDTH = 30;
const PLAYER_HEIGHT = 42;

const PLATFORM_HEIGHT = 18;

const PLATFORM_COUNT = 22;

const MAX_PLATFORM_GAP = 135;

const MIN_PLATFORM_WIDTH = 100;
const MAX_PLATFORM_WIDTH = 180;

const SLUG_WIDTH = 25;
const SLUG_HEIGHT = 8;

const SLUG_SPEED = 1.2;

const keys = {
    left: false,
    right: false,
    jump: false
};

let jumpPressed = false;


// Multiplayer is optional: without creating/joining a lobby, the game plays as before.
let peer = null;
let hostConnection = null;
let localPeerId = null;
let hostPeerId = null;
let lobbyMode = "offline"; // offline, hosting, host, joining, client
let remotePlayers = Object.create(null);
const hostConnections = new Map();
let lastStateSentAt = 0;
let lastInputSentAt = 0;
let goalTransitionPending = false;

const lobbyPanel = document.getElementById("lobbyPanel");
const lobbyStatus = document.getElementById("lobbyStatus");
const createLobbyButton = document.getElementById("createLobbyButton");
const joinLobbyButton = document.getElementById("joinLobbyButton");
const hostPeerIdInput = document.getElementById("hostPeerIdInput");
const joinPeerIdInput = document.getElementById("joinPeerIdInput");

function setLobbyStatus(text, isError = false) {
    lobbyStatus.textContent = text;
    lobbyStatus.classList.toggle("error", isError);
}

function hideLobbyPanel() {
    lobbyPanel.classList.add("hidden");
}

function showLobbyPanel() {
    lobbyPanel.classList.remove("hidden");
}

function validPeerId(id) {
    // PeerJS IDs must start and end with a letter/number; hyphens and underscores are allowed inside.
    return /^[A-Za-z0-9](?:[A-Za-z0-9_-]*[A-Za-z0-9])?$/.test(id);
}

function playerColorForPeer(id) {
    if (id && hostPeerId && id === hostPeerId) {
        return "#e53935";
    }
    if (!id) {
        return "#e53935";
    }
    let hash = 0;
    for (let i = 0; i < id.length; i++) {
        hash = ((hash << 5) - hash + id.charCodeAt(i)) | 0;
    }
    return "hsl(" + (Math.abs(hash) % 360) + ", 75%, 48%)";
}

function showPeerError(error) {
    const type = error && error.type ? error.type : "unknown";
    let message = "Multiplayer error: " + (error && error.message ? error.message : type);

    if (type === "unavailable-id") {
        message = "That peer ID is already in use. Choose a different ID.";
    } else if (type === "invalid-id") {
        message = "Invalid peer ID. Use letters/numbers, with - or _ only in the middle.";
    } else if (type === "peer-unavailable") {
        message = "Host not found. Check the peer ID and make sure the host created the lobby.";
    } else if (type === "network" || type === "server-error" || type === "socket-error") {
        message = "Could not reach PeerJS signaling. Check your internet connection and try again.";
    } else if (type === "browser-incompatible") {
        message = "This browser does not support the WebRTC features needed for multiplayer.";
    }

    if (lobbyMode === "hosting" || lobbyMode === "joining") {
        lobbyMode = "offline";
        if (peer && !peer.destroyed) {
            try { peer.destroy(); } catch (_) {}
        }
        peer = null;
        hostConnection = null;
        createLobbyButton.disabled = false;
        joinLobbyButton.disabled = false;
        showLobbyPanel();
    }

    setLobbyStatus(message, true);
    showMessage(message, 3500);
}

function createRemotePlayer(id) {
    const start = platforms[0];
    const index = Object.keys(remotePlayers).length;
    const spawnX = start
        ? start.x + start.width / 2 - PLAYER_WIDTH / 2 + (index % 4) * 28
        : 50;
    const spawnY = start ? start.y - PLAYER_HEIGHT : 100;

    return {
        id: id,
        x: Math.max(start ? start.x : 0, Math.min(spawnX, start ? start.x + start.width - PLAYER_WIDTH : spawnX)),
        y: spawnY,
        width: PLAYER_WIDTH,
        height: PLAYER_HEIGHT,
        vx: 0,
        vy: 0,
        grounded: true,
        input: { left: false, right: false, jump: false },
        jumpWasDown: false
    };
}

function getAllPlayers() {
    const result = [{ id: localPeerId, entity: player }];
    for (const id of Object.keys(remotePlayers)) {
        result.push({ id: id, entity: remotePlayers[id] });
    }
    return result;
}

function serializeState() {
    return {
        type: "state",
        platforms: platforms.map(function (p) {
            return {
                x: p.x,
                y: p.y,
                width: p.width,
                height: p.height,
                guaranteed: !!p.guaranteed
            };
        }),
        slugs: slugs.map(function (slug) {
            return {
                x: slug.x,
                y: slug.y,
                width: slug.width,
                height: slug.height,
                vx: slug.vx,
                platformIndex: platforms.indexOf(slug.platform)
            };
        }),
        goal: {
            x: goal.x,
            y: goal.y,
            width: goal.width,
            height: goal.height
        },
        players: getAllPlayers().map(function (entry) {
            const p = entry.entity;
            return {
                id: entry.id,
                x: p.x,
                y: p.y,
                width: p.width,
                height: p.height,
                vx: p.vx,
                vy: p.vy,
                grounded: !!p.grounded
            };
        })
    };
}

function applyState(state) {
    if (!state || state.type !== "state" || !Array.isArray(state.platforms) || !Array.isArray(state.players)) {
        return;
    }

    platforms = state.platforms.map(function (p) {
        return {
            x: p.x,
            y: p.y,
            width: p.width,
            height: p.height,
            guaranteed: !!p.guaranteed
        };
    });

    slugs = (Array.isArray(state.slugs) ? state.slugs : []).map(function (s) {
        const platformIndex = Number.isInteger(s.platformIndex) ? s.platformIndex : 0;
        return {
            x: s.x,
            y: s.y,
            width: s.width,
            height: s.height,
            vx: s.vx,
            platform: platforms[platformIndex] || platforms[0]
        };
    });

    if (state.goal) {
        goal = {
            x: state.goal.x,
            y: state.goal.y,
            width: state.goal.width,
            height: state.goal.height
        };
    }

    const localState = state.players.find(function (p) {
        return p.id === localPeerId;
    });

    if (localState) {
        player.x = localState.x;
        player.y = localState.y;
        player.width = localState.width || PLAYER_WIDTH;
        player.height = localState.height || PLAYER_HEIGHT;
        player.vx = localState.vx;
        player.vy = localState.vy;
        player.grounded = !!localState.grounded;
    }

    const updatedRemotes = Object.create(null);
    for (const p of state.players) {
        if (p.id === localPeerId || !p.id) {
            continue;
        }
        updatedRemotes[p.id] = {
            id: p.id,
            x: p.x,
            y: p.y,
            width: p.width || PLAYER_WIDTH,
            height: p.height || PLAYER_HEIGHT,
            vx: p.vx,
            vy: p.vy,
            grounded: !!p.grounded,
            input: { left: false, right: false, jump: false },
            jumpWasDown: false
        };
    }
    remotePlayers = updatedRemotes;
}

function safeSend(connection, payload) {
    if (!connection || !connection.open) {
        return;
    }
    try {
        connection.send(payload);
    } catch (error) {
        console.warn("Could not send multiplayer data:", error);
    }
}

function sendStateTo(connection) {
    safeSend(connection, serializeState());
}

function broadcastState() {
    const state = serializeState();
    for (const connection of hostConnections.values()) {
        if (connection && connection.open) {
            safeSend(connection, state);
        }
    }
}

function setupIncomingConnection(connection) {
    const id = connection.peer;

    connection.on("data", function (data) {
        if (!data || typeof data !== "object") {
            return;
        }
        if (data.type === "input") {
            if (!remotePlayers[id]) {
                remotePlayers[id] = createRemotePlayer(id);
            }
            const input = data.input || {};
            remotePlayers[id].input.left = !!input.left;
            remotePlayers[id].input.right = !!input.right;
            remotePlayers[id].input.jump = !!input.jump;
        }
    });

    connection.on("open", function () {
        hostConnections.set(id, connection);
        if (!remotePlayers[id]) {
            remotePlayers[id] = createRemotePlayer(id);
        }
        showMessage("Player joined: " + id, 1800);
        sendStateTo(connection);
    });

    connection.on("close", function () {
        hostConnections.delete(id);
        delete remotePlayers[id];
        showMessage("Player left", 1400);
    });

    connection.on("error", function (error) {
        console.warn("Player connection error:", error);
    });
}

function createLobby() {
    const id = hostPeerIdInput.value.trim();
    if (!id) {
        setLobbyStatus("Enter the peer ID you want to host with.", true);
        hostPeerIdInput.focus();
        return;
    }
    if (!validPeerId(id)) {
        setLobbyStatus("Use letters and numbers; hyphens or underscores may appear only between them.", true);
        hostPeerIdInput.focus();
        return;
    }
    if (typeof Peer === "undefined") {
        setLobbyStatus("PeerJS could not load. Check your internet connection and reload the page.", true);
        return;
    }

    createLobbyButton.disabled = true;
    joinLobbyButton.disabled = true;
    setLobbyStatus("Creating lobby “" + id + "”… please wait.");
    lobbyMode = "hosting";
    hostPeerId = id;

    try {
        peer = new Peer(id);
    } catch (error) {
        lobbyMode = "offline";
        createLobbyButton.disabled = false;
        joinLobbyButton.disabled = false;
        setLobbyStatus("Could not create the peer: " + error.message, true);
        return;
    }

    peer.on("open", function (openedId) {
        localPeerId = openedId;
        hostPeerId = openedId;
        lobbyMode = "host";
        createLobbyButton.disabled = false;
        joinLobbyButton.disabled = false;
        hideLobbyPanel();
        showMessage("Lobby ready — share ID: " + openedId, 4000);
    });

    peer.on("connection", setupIncomingConnection);
    peer.on("error", showPeerError);
    peer.on("disconnected", function () {
        if (lobbyMode === "host") {
            showMessage("Signaling server disconnected; existing game connections may continue.", 2600);
        }
    });
}

function joinLobby() {
    const id = joinPeerIdInput.value.trim();
    if (!id) {
        setLobbyStatus("Enter the host's peer ID first.", true);
        joinPeerIdInput.focus();
        return;
    }
    if (!validPeerId(id)) {
        setLobbyStatus("That peer ID format is invalid.", true);
        joinPeerIdInput.focus();
        return;
    }
    if (typeof Peer === "undefined") {
        setLobbyStatus("PeerJS could not load. Check your internet connection and reload the page.", true);
        return;
    }

    createLobbyButton.disabled = true;
    joinLobbyButton.disabled = true;
    setLobbyStatus("Connecting to “" + id + "”… please wait.");
    lobbyMode = "joining";
    hostPeerId = id;

    try {
        peer = new Peer();
    } catch (error) {
        lobbyMode = "offline";
        createLobbyButton.disabled = false;
        joinLobbyButton.disabled = false;
        setLobbyStatus("Could not start PeerJS: " + error.message, true);
        return;
    }

    peer.on("open", function (openedId) {
        localPeerId = openedId;
        const connection = peer.connect(id, {
            reliable: true,
            serialization: "json"
        });
        hostConnection = connection;

        connection.on("data", function (data) {
            if (data && data.type === "state") {
                applyState(data);
            }
        });

        connection.on("open", function () {
            lobbyMode = "client";
            createLobbyButton.disabled = false;
            joinLobbyButton.disabled = false;
            hideLobbyPanel();
            showMessage("Joined lobby", 1800);
        });

        connection.on("close", function () {
            if (lobbyMode === "client") {
                lobbyMode = "offline";
                hostConnection = null;
                hostPeerId = null;
                remotePlayers = Object.create(null);
                showMessage("Disconnected from the host", 2500);
            }
        });

        connection.on("error", function (error) {
            showPeerError(error);
        });
    });

    peer.on("error", showPeerError);
}

function sendClientInput(now) {
    if (lobbyMode !== "client" || !hostConnection || !hostConnection.open) {
        return;
    }
    if (now - lastInputSentAt < 40) {
        return;
    }
    lastInputSentAt = now;
    safeSend(hostConnection, {
        type: "input",
        input: {
            left: keys.left,
            right: keys.right,
            jump: keys.jump
        }
    });
}

createLobbyButton.addEventListener("click", createLobby);
joinLobbyButton.addEventListener("click", joinLobby);
hostPeerIdInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") createLobby();
});
joinPeerIdInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") joinLobby();
});

// Mobile buttons use the same input flags as the keyboard.
function bindTouchButton(buttonId, keyName, isJumpButton = false) {
    const button = document.getElementById(buttonId);

    function releaseButton() {
        if (isJumpButton) {
            keys.jump = false;
        } else {
            keys[keyName] = false;
        }

        button.classList.remove("pressed");
    }

    button.addEventListener("pointerdown", function(e) {
        e.preventDefault();

        if (button.setPointerCapture) {
            button.setPointerCapture(e.pointerId);
        }

        if (isJumpButton) {
            if (!keys.jump) {
                jumpPressed = true;
            }

            keys.jump = true;
        } else {
            keys[keyName] = true;
        }

        button.classList.add("pressed");
    });

    button.addEventListener("pointerup", function(e) {
        e.preventDefault();
        releaseButton();
    });

    button.addEventListener("pointercancel", releaseButton);
    button.addEventListener("lostpointercapture", releaseButton);
}

bindTouchButton("leftButton", "left");
bindTouchButton("rightButton", "right");
bindTouchButton("jumpButton", "jump", true);

function releaseAllControls() {
    keys.left = false;
    keys.right = false;
    keys.jump = false;

    document.querySelectorAll(".controlButton").forEach(function(button) {
        button.classList.remove("pressed");
    });
}

window.addEventListener("blur", releaseAllControls);

document.addEventListener("visibilitychange", function() {
    if (document.hidden) {
        releaseAllControls();
    }
});

document.addEventListener("keydown", function(e) {
    if (
        e.code === "ArrowLeft" ||
        e.code === "ArrowRight" ||
        e.code === "Space"
    ) {
        e.preventDefault();
    }

    if (e.code === "ArrowLeft") {
        keys.left = true;
    }

    if (e.code === "ArrowRight") {
        keys.right = true;
    }

    if (e.code === "Space") {
        if (!keys.jump) {
            jumpPressed = true;
        }

        keys.jump = true;
    }
});

document.addEventListener("keyup", function(e) {
    if (e.code === "ArrowLeft") {
        keys.left = false;
    }

    if (e.code === "ArrowRight") {
        keys.right = false;
    }

    if (e.code === "Space") {
        keys.jump = false;
    }
});

const player = {
    x: 0,
    y: 0,
    width: PLAYER_WIDTH,
    height: PLAYER_HEIGHT,
    vx: 0,
    vy: 0,
    grounded: false
};

let platforms = [];
let slugs = [];

let goal = {
    x: 0,
    y: 0,
    width: 35,
    height: 50
};

const camera = {
    x: 0,
    y: 0
};

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function randomInt(min, max) {
    return Math.floor(random(min, max + 1));
}

function generateLevel() {
    platforms = [];
    slugs = [];

    const startPlatform = {
        x: 40,
        y: HEIGHT - 80,
        width: 180,
        height: PLATFORM_HEIGHT,
        guaranteed: true
    };

    platforms.push(startPlatform);

    let currentX = startPlatform.x;
    let currentY = startPlatform.y;

    const route = [];
    const routeCount = 16;

    for (let i = 0; i < routeCount; i++) {
        const horizontalMove = randomInt(80, MAX_PLATFORM_GAP);
        currentX += horizontalMove;

        const verticalMove = randomInt(-80, 65);
        currentY += verticalMove;

        currentY = Math.max(
            100,
            Math.min(HEIGHT - 80, currentY)
        );

        const width = randomInt(
            MIN_PLATFORM_WIDTH,
            MAX_PLATFORM_WIDTH
        );

        const platform = {
            x: currentX,
            y: currentY,
            width: width,
            height: PLATFORM_HEIGHT,
            guaranteed: true
        };

        platforms.push(platform);
        route.push(platform);
    }

    const lastPlatform = route[route.length - 1];

    goal.x =
        lastPlatform.x +
        lastPlatform.width -
        50;

    goal.y =
        lastPlatform.y -
        goal.height;

    for (let i = 0; i < PLATFORM_COUNT; i++) {
        const x = random(0, currentX + 200);
        const y = random(80, HEIGHT - 50);
        const width = randomInt(70, 150);

        const platform = {
            x: x,
            y: y,
            width: width,
            height: PLATFORM_HEIGHT,
            guaranteed: false
        };

        let overlapsRoute = false;

        for (const p of platforms) {
            if (
                x < p.x + p.width &&
                x + width > p.x &&
                Math.abs(y - p.y) < 35
            ) {
                overlapsRoute = true;
                break;
            }
        }

        if (!overlapsRoute) {
            platforms.push(platform);
        }
    }

    createSlugs();

    player.x =
        startPlatform.x +
        startPlatform.width / 2 -
        player.width / 2;

    player.y =
        startPlatform.y -
        player.height;

    player.vx = 0;
    player.vy = 0;
    player.grounded = true;

    camera.x = 0;
    camera.y = 0;

    // When the host advances to a new level, bring every connected player back to the start.
    for (const remote of Object.values(remotePlayers)) {
        remote.x = startPlatform.x + startPlatform.width / 2 - remote.width / 2;
        remote.y = startPlatform.y - remote.height;
        remote.vx = 0;
        remote.vy = 0;
        remote.grounded = true;
        remote.jumpWasDown = !!(remote.input && remote.input.jump);
    }
}

function createSlugs() {
    slugs = [];

    for (let i = 0; i < platforms.length; i++) {
        const platform = platforms[i];

        if (i === 0) {
            continue;
        }

        if (Math.random() > 0.45) {
            continue;
        }

        if (
            Math.abs(platform.x - goal.x) < 50 &&
            Math.abs(platform.y - goal.y) < 50
        ) {
            continue;
        }

        const slug = {
            platform: platform,
            width: SLUG_WIDTH,
            height: SLUG_HEIGHT,
            x: random(
                platform.x + 10,
                platform.x + platform.width - SLUG_WIDTH - 10
            ),
            y: platform.y - SLUG_HEIGHT,
            vx: Math.random() < 0.5 ? -SLUG_SPEED : SLUG_SPEED
        };

        slugs.push(slug);
    }
}

function updateSlugs() {
    for (const slug of slugs) {
        slug.x += slug.vx;

        const platform = slug.platform;
        const leftEdge = platform.x;
        const rightEdge = platform.x + platform.width - slug.width;

        if (slug.x <= leftEdge) {
            slug.x = leftEdge;
            slug.vx = Math.abs(slug.vx);
        }

        if (slug.x >= rightEdge) {
            slug.x = rightEdge;
            slug.vx = -Math.abs(slug.vx);
        }

        if (Math.random() < 0.004) {
            slug.vx *= -1;
        }
    }
}

function isColliding(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function updatePlayerEntity(entity, input, isLocalPlayer) {
    if (input.left) {
        entity.vx = -MOVE_SPEED;
    } else if (input.right) {
        entity.vx = MOVE_SPEED;
    } else {
        entity.vx *= 0.8;
        if (Math.abs(entity.vx) < 0.05) {
            entity.vx = 0;
        }
    }

    const jumpDown = !!input.jump;
    const shouldJump = isLocalPlayer
        ? jumpPressed
        : (jumpDown && !entity.jumpWasDown);

    if (shouldJump && entity.grounded) {
        entity.vy = -JUMP_POWER;
        entity.grounded = false;
    }

    if (isLocalPlayer) {
        jumpPressed = false;
    }
    entity.jumpWasDown = jumpDown;

    entity.vy += GRAVITY;
    entity.x += entity.vx;

    const oldY = entity.y;
    entity.y += entity.vy;
    entity.grounded = false;

    for (const platform of platforms) {
        if (entity.vy >= 0) {
            const playerBottom = entity.y + entity.height;
            const oldBottom = oldY + entity.height;
            const platformTop = platform.y;

            if (
                oldBottom <= platformTop &&
                playerBottom >= platformTop &&
                entity.x + entity.width > platform.x &&
                entity.x < platform.x + platform.width
            ) {
                entity.y = platformTop - entity.height;
                entity.vy = 0;
                entity.grounded = true;
            }
        }
    }

    if (entity.x < 0) {
        entity.x = 0;
        entity.vx = 0;
    }

    if (entity.y > HEIGHT + 200) {
        resetPlayer(entity);
    }
}

function updatePlayer() {
    updatePlayerEntity(player, keys, true);
}

function checkSlugCollisions() {
    const playersToCheck = lobbyMode === "host"
        ? getAllPlayers()
        : [{ id: localPeerId, entity: player }];

    for (const entry of playersToCheck) {
        for (const slug of slugs) {
            if (isColliding(entry.entity, slug)) {
                resetPlayer(entry.entity);
                showMessage("Ouch! Try again!");
                return;
            }
        }
    }
}

function resetPlayer(targetPlayer = player) {
    const start = platforms[0];

    targetPlayer.x =
        start.x +
        start.width / 2 -
        targetPlayer.width / 2;

    targetPlayer.y =
        start.y -
        targetPlayer.height;

    targetPlayer.vx = 0;
    targetPlayer.vy = 0;
    targetPlayer.grounded = true;
    targetPlayer.jumpWasDown = !!(targetPlayer.input && targetPlayer.input.jump);

    if (targetPlayer === player) {
        camera.x = 0;
    }
}

function checkGoal() {
    if (lobbyMode === "host" && goalTransitionPending) {
        return;
    }

    const goalHitbox = {
        x: goal.x,
        y: goal.y,
        width: goal.width,
        height: goal.height
    };

    const playersToCheck = lobbyMode === "host"
        ? getAllPlayers()
        : [{ id: localPeerId, entity: player }];

    for (const entry of playersToCheck) {
        if (isColliding(entry.entity, goalHitbox)) {
            showMessage("Level complete! New level!");

            if (lobbyMode === "host") {
                goalTransitionPending = true;
                setTimeout(function() {
                    generateLevel();
                    goalTransitionPending = false;
                    broadcastState();
                }, 600);
            } else {
                setTimeout(function() {
                    generateLevel();
                }, 600);
            }
            return;
        }
    }
}

function updateCamera() {
    const targetX = player.x - WIDTH * 0.35;

    camera.x += (targetX - camera.x) * 0.1;

    if (camera.x < 0) {
        camera.x = 0;
    }

    const furthestPlatform = platforms.reduce(
        (furthest, p) => Math.max(furthest, p.x + p.width),
        WIDTH
    );

    const maxCamera = Math.max(0, furthestPlatform - WIDTH);

    if (camera.x > maxCamera) {
        camera.x = maxCamera;
    }
}

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);

    gradient.addColorStop(0, "#4ca7ff");
    gradient.addColorStop(1, "#d8f5ff");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.fillStyle = "rgba(255,255,255,0.65)";

    for (let i = 0; i < 8; i++) {
        const x =
            ((i * 230) - camera.x * 0.2) %
            (WIDTH + 250);

        const y = 70 + (i % 3) * 70;

        drawCloud(x, y);
    }

    ctx.fillStyle = "rgba(70,150,100,0.35)";
    ctx.beginPath();
    ctx.moveTo(0, HEIGHT);

    for (let x = 0; x <= WIDTH; x += 40) {
        const y =
            HEIGHT -
            100 -
            Math.sin((x + camera.x * 0.25) * 0.01) * 40;

        ctx.lineTo(x, y);
    }

    ctx.lineTo(WIDTH, HEIGHT);
    ctx.closePath();
    ctx.fill();
}

function drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.arc(x + 25, y - 10, 28, 0, Math.PI * 2);
    ctx.arc(x + 55, y, 22, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlatforms() {
    for (const platform of platforms) {
        const x = platform.x - camera.x;
        const y = platform.y;

        if (
            x + platform.width < 0 ||
            x > WIDTH
        ) {
            continue;
        }

        ctx.fillStyle = "#55c34a";
        ctx.fillRect(x, y, platform.width, 6);

        ctx.fillStyle = "#80512f";
        ctx.fillRect(
            x,
            y + 6,
            platform.width,
            platform.height - 6
        );

        ctx.fillStyle = "#633d25";

        for (
            let dotX = x + 12;
            dotX < x + platform.width - 5;
            dotX += 25
        ) {
            ctx.fillRect(dotX, y + 11, 5, 3);
        }
    }
}

function drawSlugs() {
    for (const slug of slugs) {
        const x = slug.x - camera.x;
        const y = slug.y;

        if (
            x + slug.width < 0 ||
            x > WIDTH
        ) {
            continue;
        }

        ctx.fillStyle = "#d71920";
        ctx.beginPath();
        ctx.ellipse(
            x + slug.width / 2,
            y + slug.height / 2,
            slug.width / 2,
            slug.height / 2,
            0,
            0,
            Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "#ff4545";
        ctx.beginPath();
        ctx.ellipse(x + 8, y + 3, 5, 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffffff";
        ctx.fillRect(x + 17, y + 1, 3, 3);
        ctx.fillRect(x + 22, y + 1, 3, 3);

        ctx.fillStyle = "#111";
        ctx.fillRect(x + 18, y + 2, 2, 2);
        ctx.fillRect(x + 23, y + 2, 2, 2);
    }
}

function drawGoal() {
    const x = goal.x - camera.x;
    const y = goal.y;

    ctx.fillStyle = "#555";
    ctx.fillRect(x + 14, y, 5, goal.height);

    ctx.fillStyle = "#ff3d67";
    ctx.beginPath();
    ctx.moveTo(x + 19, y + 3);
    ctx.lineTo(x + 35, y + 12);
    ctx.lineTo(x + 19, y + 21);
    ctx.closePath();
    ctx.fill();
}

function drawPlayerSprite(entity, shirtColor) {
    const x = entity.x - camera.x;
    const y = entity.y;

    ctx.fillStyle = shirtColor || "#e53935";
    ctx.fillRect(x, y, entity.width, entity.height);

    ctx.fillStyle = "#1976d2";
    ctx.fillRect(x, y + 18, entity.width, entity.height - 18);

    ctx.fillStyle = "#ffd1a9";
    ctx.fillRect(x + 5, y + 4, 20, 17);

    ctx.fillStyle = "#38251a";
    ctx.fillRect(x + 4, y + 2, 22, 6);

    ctx.fillStyle = "#111";
    ctx.fillRect(x + 9, y + 10, 3, 3);
    ctx.fillRect(x + 19, y + 10, 3, 3);

    ctx.fillStyle = "#263238";
    ctx.fillRect(x + 3, y + 34, 9, 8);
    ctx.fillRect(x + 18, y + 34, 9, 8);
}

function drawPlayer() {
    if (lobbyMode === "client") {
        // Render the host and every other player from the host's authoritative state.
        for (const id of Object.keys(remotePlayers)) {
            drawPlayerSprite(remotePlayers[id], playerColorForPeer(id));
        }
        drawPlayerSprite(player, playerColorForPeer(localPeerId));
        return;
    }

    drawPlayerSprite(player, "#e53935");
    if (lobbyMode === "host") {
        for (const id of Object.keys(remotePlayers)) {
            drawPlayerSprite(remotePlayers[id], playerColorForPeer(id));
        }
    }
}

function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(15, 15, 300, 50);

    ctx.fillStyle = "#fff";
    ctx.font = "16px Arial";
    ctx.fillText("← → Move   SPACE Jump", 30, 36);

    ctx.font = "13px Arial";
    ctx.fillStyle = "#ddd";
    ctx.fillText("Reach the red flag — avoid slugs!", 30, 55);
}

const message = document.getElementById("message");
let messageTimeout = null;

function showMessage(text, duration = 900) {
    message.textContent = text;
    message.style.opacity = "1";

    clearTimeout(messageTimeout);

    messageTimeout = setTimeout(function() {
        message.style.opacity = "0";
    }, duration);
}

function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    drawBackground();
    drawPlatforms();
    drawSlugs();
    drawGoal();
    drawPlayer();
    drawHUD();
}

function gameLoop() {
    const now = performance.now();

    if (lobbyMode !== "client") {
        updatePlayer();
        updateSlugs();

        if (lobbyMode === "host") {
            for (const remote of Object.values(remotePlayers)) {
                updatePlayerEntity(remote, remote.input || { left: false, right: false, jump: false }, false);
            }
        }

        checkSlugCollisions();
        updateCamera();
        checkGoal();

        if (lobbyMode === "host" && now - lastStateSentAt >= 50) {
            lastStateSentAt = now;
            broadcastState();
        }
    } else {
        // Clients render the latest host snapshot and send their controls; physics run on the host.
        sendClientInput(now);
        jumpPressed = false;
        updateCamera();
    }

    draw();
    requestAnimationFrame(gameLoop);
}

generateLevel();
gameLoop();

</script>
</body>
