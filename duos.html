<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Platformer - Multiplayer</title>

<!-- PeerJS: WebRTC peer-to-peer networking -->
<script src="https://unpkg.com/peerjs@1.5.5/dist/peerjs.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        background: #101522;
        color: white;
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        overflow: auto;\n        padding: 12px;
    }

    #gameContainer {
        width: 100%;
        max-width: 1000px;
        text-align: center;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    canvas {
        display: block;
        background: linear-gradient(#5db7ff, #d9f3ff);
        border: 3px solid #ffffff;
        border-radius: 8px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.5);
        width: min(95vw, 1000px, calc(166.6667dvh - 200px));
        height: auto;
        max-width: 95vw;
    }

    #infoRow {
        position: relative;
        width: min(100%, 1000px);
        min-height: 36px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 8px;
        padding: 0;
    }

    #info {
        margin: 0;
        font-size: 16px;
        line-height: 20px;
        color: #ddd;
        text-align: center;
    }

    #mobileControls {
        display: none;
        width: min(100%, 640px);
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        margin-top: 8px;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    .controlGroup {
        display: flex;
        align-items: center;
        gap: clamp(10px, 1.5vw, 18px);
    }

    .controlButton {
        display: flex;
        align-items: center;
        justify-content: center;
        width: clamp(64px, 8vw, 88px);
        height: clamp(58px, 7vw, 76px);
        min-width: 56px;
        min-height: 54px;
        padding: 0;
        border: 1px solid rgba(255,255,255,0.35);
        border-radius: 13px;
        background: #26334b;
        color: #fff;
        box-shadow: 0 4px 0 #111827;
        font-family: Arial, sans-serif;
        font-size: clamp(25px, 3vw, 34px);
        font-weight: bold;
        line-height: 1;
        cursor: pointer;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
    }

    .controlButton.pressed {
        background: #405779;
        transform: translateY(2px);
        box-shadow: 0 2px 0 #111827;
    }

    #jumpButton {
        width: clamp(92px, 12vw, 128px);
        font-size: clamp(15px, 2vw, 19px);
        letter-spacing: 0.3px;
    }

    #message {
        position: fixed;
        top: max(12px, env(safe-area-inset-top));
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.75);
        padding: 12px 22px;
        border-radius: 8px;
        font-size: 20px;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        max-width: calc(100vw - 24px);
        text-align: center;
        z-index: 20;
    }

    /* Touchscreen devices, including iPads */
    @media (hover: none) and (pointer: coarse), (max-width: 600px) {
        body {
            padding: max(8px, env(safe-area-inset-top))
                     max(8px, env(safe-area-inset-right))
                     max(8px, env(safe-area-inset-bottom))
                     max(8px, env(safe-area-inset-left));
        }

        #mobileControls {
            display: flex;
            flex-shrink: 0;
        }

        #infoRow {
            margin-top: 6px;
            padding: 0 4px;
            min-height: 38px;
        }

        #info {
            font-size: 14px;
            line-height: 18px;
            text-align: left;
        }

        #message {
            font-size: 16px;
            padding: 10px 16px;
        }
    }

    /* Landscape phones */
    @media (orientation: landscape) and (max-height: 500px) {
        body {
            padding: 4px 10px;
            padding-bottom: max(4px, env(safe-area-inset-bottom));
            min-height: 100vh;
            min-height: 100dvh;
        }

        #gameContainer {
            width: 100%;
            gap: 0;
        }

        canvas {
            width: min(95vw, 1000px, calc(166.6667dvh - 200px));
            max-width: 100%;
            height: auto;
        }

        #infoRow {
            margin-top: 2px;
            min-height: 32px;
            padding-left: 4px;
            padding-right: 4px;
        }

        #info {
            font-size: 11px;
            line-height: 14px;
        }

        #mobileControls {
            width: min(100%, 640px);
            gap: 12px;
            margin-top: 4px;
            padding: 0 4px;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .controlGroup {
            gap: 10px;
        }

        .controlButton {
            width: clamp(64px, 8vw, 84px);
            height: clamp(56px, 7vw, 70px);
            min-width: 56px;
            min-height: 52px;
            border-radius: 11px;
            font-size: clamp(25px, 3vw, 32px);
        }

        #jumpButton {
            width: clamp(92px, 12vw, 120px);
            height: clamp(56px, 7vw, 70px);
            font-size: clamp(15px, 2vw, 18px);
        }
    }

    #lobby {
        width: min(95vw, 1000px);
        background: #1c263b;
        border: 1px solid #394963;
        border-radius: 12px;
        padding: 12px;
        margin-bottom: 10px;
    }
    #lobby h2 { margin: 0 0 10px; font-size: 19px; }
    .lobbyControls { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin:8px 0; }
    #lobby input, #lobby button {
        border:1px solid #536783; border-radius:7px; padding:10px 12px;
        font-size:14px; max-width:100%;
    }
    #lobby input { background:#101522; color:white; width:min(220px, 42vw); min-width:0; }
    #lobby button { background:#3478f6; color:white; font-weight:bold; cursor:pointer; }
    #lobby button:disabled { opacity:.5; cursor:not-allowed; }
    #roomCode { color:#7ee7ff; font-weight:bold; overflow-wrap:anywhere; user-select:all; }
    #roomInfo { margin-top:6px; }
    #status { color:#d3dced; font-size:13px; line-height:1.4; overflow-wrap:anywhere; margin-top:6px; }
    #info { margin-top:8px; font-size:14px; line-height:1.5; color:#ddd; }
    #mobileControls { gap:clamp(10px,1.5vw,18px); }
    #mobileControls button {
        width:clamp(64px,8vw,88px); height:clamp(58px,7vw,76px);
        min-width:56px; min-height:54px; padding:0; border:1px solid rgba(255,255,255,.35);
        border-radius:13px; background:#26334b; color:#fff; box-shadow:0 4px 0 #111827;
        font-size:clamp(25px,3vw,34px); font-weight:bold; touch-action:none;
        user-select:none; -webkit-user-select:none;
    }
    #mobileControls button.pressed { background:#405779; transform:translateY(2px); }
    #jumpButton { width:clamp(92px,12vw,128px)!important; font-size:clamp(15px,2vw,19px)!important; }
    #message { position:fixed; top:max(12px,env(safe-area-inset-top)); left:50%; transform:translateX(-50%);
        background:rgba(0,0,0,.75); padding:12px 22px; border-radius:8px; font-size:20px;
        opacity:0; transition:opacity .2s; pointer-events:none; max-width:calc(100vw - 24px);
        text-align:center; z-index:20; }
    @media (hover:none) and (pointer:coarse), (max-width:600px) {
        body { padding:max(8px,env(safe-area-inset-top)) max(8px,env(safe-area-inset-right)) max(8px,env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left)); }
        #mobileControls { display:flex; flex-shrink:0; }
        #infoRow { margin-top:6px; }
        #info { font-size:13px; }
        #message { font-size:16px; padding:10px 16px; }
    }
    @media (orientation:landscape) and (max-height:500px) {
        body { padding:4px 10px; min-height:100dvh; }
        #gameContainer { gap:0; }
        #lobby { padding:6px; margin-bottom:4px; }
        #lobby h2 { font-size:15px; margin-bottom:4px; }
        .lobbyControls { margin:4px 0; gap:5px; }
        #lobby input, #lobby button { padding:6px 8px; }
        #info { font-size:11px; margin-top:3px; }
        #mobileControls { margin-top:4px; gap:10px; }
        #mobileControls button { height:52px; min-height:48px; }
    }
</style>
<body>
<div id="gameContainer">
    <div id="lobby">
        <h2>🌎 Random Platformer Multiplayer</h2>
        <div class="lobbyControls" id="setupControls">
            <input id="playerName" maxlength="16" placeholder="Your player name" value="Player" aria-label="Your player name">
            <input id="hostRoomId" maxlength="32" placeholder="Choose lobby code" autocomplete="off" aria-label="Lobby code for host">
            <button id="hostButton">Create Lobby</button>
        </div>
        <div class="lobbyControls" id="joinControls">
            <input id="joinCode" maxlength="32" placeholder="Enter host's code" autocomplete="off" aria-label="Host lobby code">
            <button id="joinButton">Join Lobby</button>
        </div>
        <div id="roomInfo" hidden>Lobby code: <span id="roomCode"></span> <button id="copyButton" type="button">Copy</button></div>
        <div id="status">Choose a lobby code and create a lobby, or enter a friend's code to join.</div>
    </div>
    <canvas id="game" width="1000" height="600"></canvas>
    <div id="mobileControls" aria-label="Mobile game controls">
        <div class="controlGroup">
            <button type="button" id="leftButton" aria-label="Move left">◀</button>
            <button type="button" id="rightButton" aria-label="Move right">▶</button>
        </div>
        <button type="button" id="jumpButton" aria-label="Jump">JUMP</button>
    </div>
    <div id="info">← → Move &nbsp; | &nbsp; Space Jump<br>Reach the red flag and avoid the slugs! Work together!</div>
</div>
<div id="message"></div>

<script>
"use strict";

// ============================================================
// CONFIGURATION
// ============================================================

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const WIDTH = canvas.width;
const HEIGHT = canvas.height;

const GRAVITY = 0.55;
const MOVE_SPEED = 5;
const JUMP_POWER = 12;

const PLAYER_WIDTH = 30;
const PLAYER_HEIGHT = 42;
const PLATFORM_HEIGHT = 18;
const PLATFORM_COUNT = 22;
const MAX_PLATFORM_GAP = 135;
const MIN_PLATFORM_WIDTH = 100;
const MAX_PLATFORM_WIDTH = 180;

const SLUG_WIDTH = 25;
const SLUG_HEIGHT = 8;
const SLUG_SPEED = 1.2;

const SNAPSHOT_INTERVAL = 50;
const INPUT_INTERVAL = 35;

// ============================================================
// MULTIPLAYER STATE
// ============================================================

let peer = null;\nlet requestedPeerId = undefined;
let connection = null;
let isHost = false;
let connected = false;
let gameStarted = false;
let connectionAttempt = 0;

let localId = "";
let remoteId = "";
let localPlayerKey = "p1";
let remotePlayerKey = "p2";

let lastInputSent = 0;
let lastSnapshotSent = 0;
let lastSnapshotReceived = 0;
let lastLevelId = -1;

let gameMessage = "";
let messageTimer = 0;
let levelNumber = 1;
let world = null;

const keys = {
    left: false,
    right: false,
    jump: false
};

let jumpPressed = false;

const players = {
    p1: makePlayer("Player 1", "#e53935"),
    p2: makePlayer("Player 2", "#8e44ff")
};

function makePlayer(name, color) {
    return {
        name,
        color,
        x: 0,
        y: 0,
        width: PLAYER_WIDTH,
        height: PLAYER_HEIGHT,
        vx: 0,
        vy: 0,
        grounded: false,
        wins: 0
    };
}

const camera = { x: 0, y: 0 };

// ============================================================
// HELPERS
// ============================================================

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function randomInt(min, max) {
    return Math.floor(random(min, max + 1));
}

function showMessage(text, duration = 1600) {
    gameMessage = text;

    const el = document.getElementById("message");
    el.textContent = text;
    el.style.opacity = "1";

    clearTimeout(messageTimer);
    messageTimer = setTimeout(() => {
        el.style.opacity = "0";
    }, duration);
}

function setStatus(text) {
    document.getElementById("status").textContent = text;
}

function send(data) {
    if (connection && connection.open) {
        try {
            connection.send(data);
        } catch (err) {
            console.error("Network send failed:", err);
        }
    }
}

function copyRoomId() {
    const id = localId;
    if (!id) return;

    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(id).then(() => {
            showMessage("Room ID copied!");
        }).catch(() => {
            window.prompt("Copy this room ID:", id);
        });
    } else {
        window.prompt("Copy this room ID:", id);
    }
}

document.getElementById("copyButton").addEventListener("click", copyRoomId);

// ============================================================
// INPUT
// ============================================================

document.addEventListener("keydown", e => {
    if (["ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
        e.preventDefault();
    }

    if (e.code === "ArrowLeft" || e.code === "KeyA") {
        keys.left = true;
    }

    if (e.code === "ArrowRight" || e.code === "KeyD") {
        keys.right = true;
    }

    if (e.code === "Space" || e.code === "ArrowUp" ||
        e.code === "KeyW") {
        if (!keys.jump) jumpPressed = true;
        keys.jump = true;
    }
});

document.addEventListener("keyup", e => {
    if (e.code === "ArrowLeft" || e.code === "KeyA") {
        keys.left = false;
    }

    if (e.code === "ArrowRight" || e.code === "KeyD") {
        keys.right = false;
    }

    if (e.code === "Space" || e.code === "ArrowUp" ||
        e.code === "KeyW") {
        keys.jump = false;
    }
});

window.addEventListener("blur", () => {
    keys.left = keys.right = keys.jump = false;
    jumpPressed = false;
});

function bindTouchButton(id, key) {
    const button = document.getElementById(id);

    const start = e => {
        e.preventDefault();
        if (key === "jump") {
            if (!keys.jump) jumpPressed = true;
            keys.jump = true;
        } else {
            keys[key] = true;
        }
        try { button.setPointerCapture(e.pointerId); } catch (_) {}
    };

    const end = e => {
        e.preventDefault();
        if (key === "jump") keys.jump = false;
        else keys[key] = false;
    };

    button.addEventListener("pointerdown", start);
    button.addEventListener("pointerup", end);
    button.addEventListener("pointercancel", end);
    button.addEventListener("lostpointercapture", end);
}

bindTouchButton("leftButton", "left");
bindTouchButton("rightButton", "right");
bindTouchButton("jumpButton", "jump");

// ============================================================
// WORLD GENERATION
// Only the host generates and simulates the shared world.
// ============================================================

function generateLevel() {
    const platforms = [];
    const slugs = [];

    const startPlatform = {
        x: 40,
        y: HEIGHT - 80,
        width: 180,
        height: PLATFORM_HEIGHT,
        guaranteed: true
    };

    platforms.push(startPlatform);

    let currentX = startPlatform.x;
    let currentY = startPlatform.y;
    const route = [];

    for (let i = 0; i < 16; i++) {
        currentX += randomInt(80, MAX_PLATFORM_GAP);
        currentY += randomInt(-80, 65);
        currentY = Math.max(100, Math.min(HEIGHT - 80, currentY));

        const platform = {
            x: currentX,
            y: currentY,
            width: randomInt(MIN_PLATFORM_WIDTH, MAX_PLATFORM_WIDTH),
            height: PLATFORM_HEIGHT,
            guaranteed: true
        };

        platforms.push(platform);
        route.push(platform);
    }

    const lastPlatform = route[route.length - 1];

    const goal = {
        x: lastPlatform.x + lastPlatform.width - 50,
        y: lastPlatform.y - 50,
        width: 35,
        height: 50
    };

    for (let i = 0; i < PLATFORM_COUNT; i++) {
        const x = random(0, currentX + 200);
        const y = random(80, HEIGHT - 50);
        const width = randomInt(70, 150);

        let overlapsRoute = false;

        for (const p of platforms) {
            if (
                x < p.x + p.width &&
                x + width > p.x &&
                Math.abs(y - p.y) < 35
            ) {
                overlapsRoute = true;
                break;
            }
        }

        if (!overlapsRoute) {
            platforms.push({
                x, y, width,
                height: PLATFORM_HEIGHT,
                guaranteed: false
            });
        }
    }

    for (let i = 1; i < platforms.length; i++) {
        const p = platforms[i];

        if (Math.random() > 0.45) continue;

        if (
            Math.abs(p.x - goal.x) < 50 &&
            Math.abs(p.y - goal.y) < 50
        ) continue;

        slugs.push({
            platformIndex: i,
            width: SLUG_WIDTH,
            height: SLUG_HEIGHT,
            x: random(p.x + 10, p.x + p.width - SLUG_WIDTH - 10),
            y: p.y - SLUG_HEIGHT,
            vx: Math.random() < 0.5 ? -SLUG_SPEED : SLUG_SPEED
        });
    }

    world = { platforms, slugs, goal };
    levelNumber++;

    resetPlayer(players.p1);
    resetPlayer(players.p2);

    camera.x = 0;

    lastLevelId++;
}

function resetPlayer(player) {
    if (!world || !world.platforms.length) return;

    const start = world.platforms[0];

    player.x = start.x + start.width / 2 - player.width / 2;
    player.y = start.y - player.height;
    player.vx = 0;
    player.vy = 0;
    player.grounded = true;
}

function serializeWorld() {
    return {
        platforms: world.platforms,
        slugs: world.slugs,
        goal: world.goal,
        levelNumber,
        levelId: lastLevelId
    };
}

function loadWorld(data) {
    if (!data || !Array.isArray(data.platforms) ||
        !Array.isArray(data.slugs) || !data.goal) return;

    world = {
        platforms: data.platforms,
        slugs: data.slugs,
        goal: data.goal
    };

    levelNumber = data.levelNumber || 1;
    lastLevelId = data.levelId ?? lastLevelId;

    camera.x = 0;
}

// ============================================================
// PEERJS CONNECTION
// ============================================================

document.getElementById("hostButton").addEventListener("click", createGame);
document.getElementById("joinButton").addEventListener("click", joinGame);

function getPlayerName() {
    const value = document.getElementById("playerName").value.trim();
    return value.slice(0, 16) || "Player";
}

function createPeer() {
    if (typeof Peer === "undefined") {
        setStatus("PeerJS could not load. Check your internet connection and reload.");
        return null;
    }

    try {
        peer = new Peer(requestedPeerId, { debug: 1 });
    } catch (err) {
        setStatus("Could not initialize PeerJS: " + err.message);
        return null;
    }

    peer.on("error", err => {
        console.error("PeerJS error:", err);
        setStatus("Network error: " + err.type + ". Check your connection and try again.");
    });

    peer.on("disconnected", () => {
        setStatus("Signaling server disconnected. Existing peer connections may still work.");
    });

    peer.on("close", () => {
        setStatus("Peer connection closed.");
    });

    return peer;
}

function createGame() {
    if (peer) return;
    const requested = document.getElementById("hostRoomId").value.trim();
    if (!requested) {
        setStatus("Type a lobby code first. Your friend will enter this exact code.");
        document.getElementById("hostRoomId").focus();
        return;
    }
    // PeerJS IDs should use simple characters; keep the visible code identical to the ID.
    if (!/^[A-Za-z0-9_-]{1,32}$/.test(requested)) {
        setStatus("Use 1–32 letters, numbers, hyphens, or underscores for the lobby code.");
        return;
    }
    requestedPeerId = requested;
    isHost = true;
    connected = false;
    gameStarted = true;

    localPlayerKey = "p1";
    remotePlayerKey = "p2";

    players.p1.name = getPlayerName();
    players.p2.name = "Waiting for player...";
    players.p1.color = "#e53935";
    players.p2.color = "#8e44ff";

    setStatus("Creating lobby “" + requestedPeerId + "”…");
    document.getElementById("setupControls").hidden = true;
    document.getElementById("joinControls").hidden = true;

    document.getElementById("hostButton").disabled = true;
    document.getElementById("joinButton").disabled = true;

    const p = createPeer();
    if (!p) return;

    p.on("open", id => {
        localId = id;

        document.getElementById("roomInfo").hidden = false;
        document.getElementById("roomCode").textContent = id;

        setStatus("Room created! Share your Peer ID with your friend.");
        showMessage("Room created! Waiting for a player...", 2500);

        generateLevel();

        p.on("connection", conn => {
            if (connection && connection.open) {
                conn.close();
                return;
            }

            connection = conn;
            setupConnection(conn, true);
        });
    });
}

function joinGame() {
    if (peer) return;

    const hostId = document.getElementById("joinCode").value.trim();

    if (!hostId) {
        setStatus("Enter the host's Peer ID first.");
        return;
    }

    isHost = false;
    connected = false;
    gameStarted = true;

    localPlayerKey = "p2";
    remotePlayerKey = "p1";

    players.p2.name = getPlayerName();
    players.p2.color = "#8e44ff";

    setStatus("Connecting to lobby “" + hostId + "”…");
    document.getElementById("setupControls").hidden = true;
    document.getElementById("joinControls").hidden = true;
    document.getElementById("hostButton").disabled = true;
    document.getElementById("joinButton").disabled = true;

    const p = createPeer();
    if (!p) return;

    p.on("open", id => {
        localId = id;

        connection = p.connect(hostId, {
            reliable: true,
            serialization: "json",
            metadata: { name: getPlayerName() }
        });

        setupConnection(connection, false);
    });
}

function setupConnection(conn, hostSide) {
    connectionAttempt++;
    const attempt = connectionAttempt;

    conn.on("open", () => {
        if (attempt !== connectionAttempt) return;

        connected = true;
        remoteId = conn.peer;

        if (hostSide) {
            players.p2.name = conn.metadata?.name || "Player 2";
            players.p2.color = "#8e44ff";

            setStatus("Connected! You are the host. Both players are ready.");
            showMessage("Player joined!", 2000);

            send({
                type: "welcome",
                playerKey: "p2",
                name: players.p1.name,
                world: serializeWorld(),
                players: packPlayers(),
                hostTime: Date.now()
            });
        } else {
            setStatus("Connected to host! Loading the shared level...");
            showMessage("Connected to host!", 2000);

            send({
                type: "hello",
                name: getPlayerName()
            });
        }
    });

    conn.on("data", data => {
        if (attempt !== connectionAttempt) return;
        if (!data || typeof data !== "object") return;

        if (isHost) handleHostMessage(data);
        else handleGuestMessage(data);
    });

    conn.on("close", () => {
        if (attempt !== connectionAttempt) return;

        connected = false;
        connection = null;
        connectionAttempt++;

        setStatus("Player disconnected. Refresh to create or join another room.");
        showMessage("Player disconnected.", 2500);
    });

    conn.on("error", err => {
        console.error("Data connection error:", err);
        setStatus("Connection error: " + err.message);
    });
}

function handleHostMessage(data) {
    if (data.type === "hello") {
        players.p2.name = String(data.name || "Player 2").slice(0, 16);
        showMessage(players.p2.name + " joined!", 2000);

        send({
            type: "welcome",
            playerKey: "p2",
            name: players.p1.name,
            world: serializeWorld(),
            players: packPlayers(),
            hostTime: Date.now()
        });
    }

    if (data.type === "input") {
        // The host simulates the guest's character.
        const input = data.input || {};
        remoteInput.left = !!input.left;
        remoteInput.right = !!input.right;

        if (input.jump && !remoteInput.jump) {
            remoteJumpPressed = true;
        }

        remoteInput.jump = !!input.jump;
    }
}

function handleGuestMessage(data) {
    if (data.type === "welcome") {
        players.p1.name = String(data.name || "Host").slice(0, 16);
        players.p1.color = "#e53935";
        players.p2.name = getPlayerName();

        loadWorld(data.world);

        if (data.players) applyPlayers(data.players);

        gameStarted = true;
        showMessage("Level loaded! Good luck!", 2000);
        return;
    }

    if (data.type === "snapshot") {
        if (data.levelId !== lastLevelId) {
            loadWorld(data.world);
        } else if (data.world && world) {
            // Keep the authoritative slug positions synchronized.
            world.slugs = data.world.slugs;
        }

        if (data.players) applyPlayers(data.players);

        if (data.levelNumber) levelNumber = data.levelNumber;

        lastSnapshotReceived = performance.now();

        if (data.message) showMessage(data.message, 1600);
    }
}

const remoteInput = {
    left: false,
    right: false,
    jump: false
};

let remoteJumpPressed = false;

function packPlayers() {
    const result = {};

    for (const key of ["p1", "p2"]) {
        const p = players[key];

        result[key] = {
            name: p.name,
            color: p.color,
            x: p.x,
            y: p.y,
            vx: p.vx,
            vy: p.vy,
            grounded: p.grounded,
            wins: p.wins
        };
    }

    return result;
}

function applyPlayers(data) {
    for (const key of ["p1", "p2"]) {
        if (!data[key]) continue;

        const src = data[key];
        const dst = players[key];

        dst.name = String(src.name || dst.name).slice(0, 16);
        dst.color = src.color || dst.color;
        dst.x = Number(src.x) || 0;
        dst.y = Number(src.y) || 0;
        dst.vx = Number(src.vx) || 0;
        dst.vy = Number(src.vy) || 0;
        dst.grounded = !!src.grounded;
        dst.wins = Number(src.wins) || 0;
    }
}

// ============================================================
// PHYSICS
// ============================================================

function isColliding(a, b) {
    return (
        a.x < b.x + b.width &&
        a.x + a.width > b.x &&
        a.y < b.y + b.height &&
        a.y + a.height > b.y
    );
}

function updatePlayer(player, input, jump) {
    if (!world) return;

    if (input.left) {
        player.vx = -MOVE_SPEED;
    } else if (input.right) {
        player.vx = MOVE_SPEED;
    } else {
        player.vx *= 0.8;
        if (Math.abs(player.vx) < 0.05) player.vx = 0;
    }

    if (jump && player.grounded) {
        player.vy = -JUMP_POWER;
        player.grounded = false;
    }

    player.vy += GRAVITY;
    player.x += player.vx;

    const oldY = player.y;
    player.y += player.vy;
    player.grounded = false;

    for (const platform of world.platforms) {
        if (player.vy < 0) continue;

        const oldBottom = oldY + player.height;
        const newBottom = player.y + player.height;

        if (
            oldBottom <= platform.y &&
            newBottom >= platform.y &&
            player.x + player.width > platform.x &&
            player.x < platform.x + platform.width
        ) {
            player.y = platform.y - player.height;
            player.vy = 0;
            player.grounded = true;
        }
    }

    if (player.x < 0) {
        player.x = 0;
        player.vx = 0;
    }

    if (player.y > HEIGHT + 200) {
        resetPlayer(player);
        return "fell";
    }

    return null;
}

function updateSlugs() {
    if (!world) return;

    for (const slug of world.slugs) {
        const platform = world.platforms[slug.platformIndex];
        if (!platform) continue;

        slug.x += slug.vx;

        const left = platform.x;
        const right = platform.x + platform.width - slug.width;

        if (slug.x <= left) {
            slug.x = left;
            slug.vx = Math.abs(slug.vx);
        }

        if (slug.x >= right) {
            slug.x = right;
            slug.vx = -Math.abs(slug.vx);
        }

        if (Math.random() < 0.004) slug.vx *= -1;
    }
}

function checkSlugCollisions(player) {
    if (!world) return false;

    for (const slug of world.slugs) {
        if (isColliding(player, slug)) {
            resetPlayer(player);
            return true;
        }
    }

    return false;
}

function checkGoal(player) {
    return !!world && isColliding(player, world.goal);
}

// ============================================================
// HOST GAME SIMULATION AND SYNCHRONIZATION
// ============================================================

function hostUpdate() {
    if (!world) return;

    updateSlugs();

    const fall1 = updatePlayer(players.p1, keys, jumpPressed);
    const fall2 = updatePlayer(players.p2, remoteInput, remoteJumpPressed);

    jumpPressed = false;
    remoteJumpPressed = false;

    if (fall1 || fall2) {
        // A fall resets only the player who fell.
    }

    if (checkSlugCollisions(players.p1)) {
        showMessage("Ouch! Player 1 was hit!");
    }

    if (checkSlugCollisions(players.p2)) {
        showMessage("Ouch! Player 2 was hit!");
    }

    // Either player reaching the flag completes the level for both.
    if (checkGoal(players.p1) || checkGoal(players.p2)) {
        players.p1.wins++;
        players.p2.wins++;

        showMessage("Level complete! Loading the next level!", 1800);
        generateLevel();

        if (connected) {
            send({
                type: "snapshot",
                world: serializeWorld(),
                players: packPlayers(),
                levelId: lastLevelId,
                levelNumber,
                message: "New level!"
            });
        }
    }
}

function guestSendInput() {
    if (!connected || isHost) return;

    const now = performance.now();
    if (now - lastInputSent < INPUT_INTERVAL) return;

    lastInputSent = now;

    send({
        type: "input",
        input: {
            left: keys.left,
            right: keys.right,
            jump: keys.jump
        }
    });
}

function hostSendSnapshot() {
    if (!connected || !isHost || !world) return;

    const now = performance.now();
    if (now - lastSnapshotSent < SNAPSHOT_INTERVAL) return;

    lastSnapshotSent = now;

    send({
        type: "snapshot",
        world: {
            slugs: world.slugs
        },
        players: packPlayers(),
        levelId: lastLevelId,
        levelNumber
    });
}

// ============================================================
// CAMERA
// ============================================================

function updateCamera() {
    const player = players[localPlayerKey];

    const targetX = player.x - WIDTH * 0.35;
    camera.x += (targetX - camera.x) * 0.1;

    if (camera.x < 0) camera.x = 0;

    const furthest = world
        ? world.platforms.reduce(
            (max, p) => Math.max(max, p.x + p.width), WIDTH
        )
        : WIDTH;

    const maxCamera = Math.max(0, furthest - WIDTH);

    if (camera.x > maxCamera) camera.x = maxCamera;
}

// ============================================================
// DRAWING
// ============================================================

function drawBackground() {
    const gradient = ctx.createLinearGradient(0, 0, 0, HEIGHT);
    gradient.addColorStop(0, "#4ca7ff");
    gradient.addColorStop(1, "#d8f5ff");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, WIDTH, HEIGHT);

    ctx.fillStyle = "rgba(255,255,255,.65)";

    for (let i = 0; i < 8; i++) {
        const x = ((i * 230 - camera.x * 0.2) %
            (WIDTH + 250) + WIDTH + 250) % (WIDTH + 250);

        drawCloud(x, 70 + (i % 3) * 70);
    }

    ctx.fillStyle = "rgba(70,150,100,.35)";
    ctx.beginPath();
    ctx.moveTo(0, HEIGHT);

    for (let x = 0; x <= WIDTH; x += 40) {
        const y = HEIGHT - 100 -
            Math.sin((x + camera.x * 0.25) * 0.01) * 40;

        ctx.lineTo(x, y);
    }

    ctx.lineTo(WIDTH, HEIGHT);
    ctx.closePath();
    ctx.fill();
}

function drawCloud(x, y) {
    ctx.beginPath();
    ctx.arc(x, y, 20, 0, Math.PI * 2);
    ctx.arc(x + 25, y - 10, 28, 0, Math.PI * 2);
    ctx.arc(x + 55, y, 22, 0, Math.PI * 2);
    ctx.fill();
}

function drawPlatforms() {
    if (!world) return;

    for (const p of world.platforms) {
        const x = p.x - camera.x;

        if (x + p.width < 0 || x > WIDTH) continue;

        ctx.fillStyle = "#55c34a";
        ctx.fillRect(x, p.y, p.width, 6);

        ctx.fillStyle = "#80512f";
        ctx.fillRect(x, p.y + 6, p.width, p.height - 6);

        ctx.fillStyle = "#633d25";

        for (let dotX = x + 12; dotX < x + p.width - 5; dotX += 25) {
            ctx.fillRect(dotX, p.y + 11, 5, 3);
        }
    }
}

function drawSlugs() {
    if (!world) return;

    for (const slug of world.slugs) {
        const x = slug.x - camera.x;
        const y = slug.y;

        if (x + slug.width < 0 || x > WIDTH) continue;

        ctx.fillStyle = "#d71920";
        ctx.beginPath();
        ctx.ellipse(
            x + slug.width / 2, y + slug.height / 2,
            slug.width / 2, slug.height / 2,
            0, 0, Math.PI * 2
        );
        ctx.fill();

        ctx.fillStyle = "#ff4545";
        ctx.beginPath();
        ctx.ellipse(x + 8, y + 3, 5, 2, 0, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#fff";
        ctx.fillRect(x + 17, y + 1, 3, 3);
        ctx.fillRect(x + 22, y + 1, 3, 3);

        ctx.fillStyle = "#111";
        ctx.fillRect(x + 18, y + 2, 2, 2);
        ctx.fillRect(x + 23, y + 2, 2, 2);
    }
}

function drawGoal() {
    if (!world) return;

    const goal = world.goal;
    const x = goal.x - camera.x;
    const y = goal.y;

    ctx.fillStyle = "#555";
    ctx.fillRect(x + 14, y, 5, goal.height);

    ctx.fillStyle = "#ff3d67";
    ctx.beginPath();
    ctx.moveTo(x + 19, y + 3);
    ctx.lineTo(x + 35, y + 12);
    ctx.lineTo(x + 19, y + 21);
    ctx.closePath();
    ctx.fill();
}

function drawPlayer(player, isLocal) {
    const x = player.x - camera.x;
    const y = player.y;

    if (x + player.width < 0 || x > WIDTH) return;

    // Player body
    ctx.fillStyle = player.color;
    ctx.fillRect(x, y, player.width, player.height);

    // Shirt
    ctx.fillStyle = isLocal ? "#1976d2" : "#00a896";
    ctx.fillRect(x, y + 18, player.width, player.height - 18);

    // Face
    ctx.fillStyle = "#ffd1a9";
    ctx.fillRect(x + 5, y + 4, 20, 17);

    // Hair
    ctx.fillStyle = "#38251a";
    ctx.fillRect(x + 4, y + 2, 22, 6);

    // Eyes
    ctx.fillStyle = "#111";
    ctx.fillRect(x + 9, y + 10, 3, 3);
    ctx.fillRect(x + 19, y + 10, 3, 3);

    // Legs
    ctx.fillStyle = "#263238";
    ctx.fillRect(x + 3, y + 34, 9, 8);
    ctx.fillRect(x + 18, y + 34, 9, 8);

    // Name label
    ctx.font = "bold 13px Arial";
    ctx.textAlign = "center";

    const label = player.name + (isLocal ? " (You)" : "");

    const labelWidth = ctx.measureText(label).width + 12;

    ctx.fillStyle = "rgba(0,0,0,.7)";
    ctx.fillRect(x + player.width / 2 - labelWidth / 2, y - 25,
        labelWidth, 19);

    ctx.fillStyle = "#fff";
    ctx.fillText(label, x + player.width / 2, y - 11);

    ctx.textAlign = "left";
}

function drawHUD() {
    ctx.fillStyle = "rgba(0,0,0,.55)";
    ctx.fillRect(15, 15, 335, 79);

    ctx.fillStyle = "#fff";
    ctx.font = "bold 16px Arial";
    ctx.fillText("Level " + levelNumber, 30, 38);

    ctx.font = "13px Arial";
    ctx.fillStyle = "#f3f5ff";
    ctx.fillText("P1: " + players.p1.name, 30, 59);
    ctx.fillText("P2: " + players.p2.name, 30, 77);

    ctx.fillStyle = connected ? "#7dff9b" : "#ffdb76";
    ctx.fillText(
        connected ? "● ONLINE" : "● OFFLINE / SOLO",
        WIDTH - 155, 30
    );
}

function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    drawBackground();
    drawPlatforms();
    drawSlugs();
    drawGoal();

    drawPlayer(players.p1, localPlayerKey === "p1");
    drawPlayer(players.p2, localPlayerKey === "p2");

    drawHUD();
}

// ============================================================
// MAIN LOOP
// ============================================================

function gameLoop() {
    if (gameStarted && world) {
        if (isHost) {
            hostUpdate();
            hostSendSnapshot();
        } else {
            guestSendInput();
        }

        updateCamera();
    }

    draw();
    requestAnimationFrame(gameLoop);
}

// ============================================================
// INITIALIZATION
// ============================================================

// Show a local playable level before joining a room.
generateLevel();
gameStarted = true;
players.p1.name = "Player 1";
players.p2.name = "Player 2";
players.p1.color = "#e53935";
players.p2.color = "#8e44ff";

gameLoop();

</script>
